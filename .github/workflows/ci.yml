name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Set the repository variable PRINTFIT_GIT to a pinned install URL, for example
      # git+https://github.com/adamcelove/printfit@<commit-sha>. Unset: the printfit steps are skipped.
      PRINTFIT_GIT: ${{ vars.PRINTFIT_GIT }}
      # Ubuntu 24.04 runners cannot start Chrome's sandbox; printfit's CI-only opt-in.
      PRINTFIT_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1
        id: chrome
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
      - name: Scrub check
        run: uv run python scripts/scrub-check.py
      - name: Install printfit
        if: env.PRINTFIT_GIT != ''
        run: uv tool install "$PRINTFIT_GIT"
      - name: Tests
        env:
          PRINTFIT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: uv run pytest -q
      - name: Print check on the example (blank state)
        if: env.PRINTFIT_GIT != ''
        env:
          PRINTFIT_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: printfit check examples/horizontal-launch/worksheet.html --out "$RUNNER_TEMP/pf"
